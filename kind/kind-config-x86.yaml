kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# Make containerd read the registry mirrors written to /etc/containerd/certs.d
# (see SRE-agent/registry/REGISTRY_SETUP.md); without this the hosts.toml files are ignored.
containerdConfigPatches:
- |-
  [plugins."io.containerd.grpc.v1.cri".registry]
    config_path = "/etc/containerd/certs.d"
# kubectl logs reads only the current log file and kubelet rotates it at 10 MiB: error-heavy services lost the
# start of their logs. Events expire after 1 h by default: a 95-min session kept none.
# etcd in the node's /tmp, a tmpfs: on a slow disk (190 ms a write) its fsyncs time out and the deploy fails.
# The cluster lives for one run, so etcd needs no durable storage.
kubeadmConfigPatches:
- |
  kind: KubeletConfiguration
  containerLogMaxSize: "200Mi"
- |
  kind: ClusterConfiguration
  apiServer:
    extraArgs:
      event-ttl: "24h"
  etcd:
    local:
      dataDir: /tmp/etcd
nodes:
  - role: control-plane
    image: jacksonarthurclark/aiopslab-kind-x86:latest
    extraMounts:
      - hostPath: /run/udev
        containerPath: /run/udev
    extraPortMappings:
      - containerPort: 32000 # Prometheus NodePort (observe/prometheus-server), used as PROMETHEUS_SERVER_URL
        hostPort: 32000
  - role: worker
    image: jacksonarthurclark/aiopslab-kind-x86:latest
    extraMounts:
      - hostPath: /run/udev
        containerPath: /run/udev